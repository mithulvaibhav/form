<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body>
        <h1>Student Registration Form</h1>
    <table >
        
        
        <tr>
            <td><b>Roll no. :</b></td>
            <td><input type="text" ></td>
        </tr>
        <tr>
            <td><b>Student name :</b></td>
            <td>
                <input type="text" placeholder="First Name"> 
                <b>-</b> 
                <input type="text" placeholder="Last Name" >
            </td>
        </tr>

    
        <tr>
            <td><b>Father's name :</b></td>
            <td><input type="text" size="45"></td>
        </tr>
        
        <tr>
            <td><b>Date of birth :</b></td>
            <td>
                <select>
                    <option>Day</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option> 
                </select>
                <select>
                    <option>Month</option>
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                    <option>April</option>
                    <option>May</option>
                </select>
                <select>
                    <option>Year</option>
                    <option>2023</option>
                    <option>2022</option>
                    <option>2021</option>
                    <option>2020</option>
                </select>
                <i><b>(DD-MM-YYYY)</b></i>
            </td>
        </tr>

    
        <tr>
            <td><b>Mobile no. :</b></td>
            <td>
                <input type="text" value="+91" > 
                <b>-</b> 
                <input type="text" >
            </td>
        </tr>

        <tr>
            <td><b>Email id :</b></td>
            <td><input type="email" ></td>
        </tr>


        <tr>    
            <td><b>Password :</b></td>
            <td><input type="password" ></td>
        </tr>

    
        <tr>
            <td><b>Gender :</b></td>
            <td>
                <input type="radio" name="gender" id="male"> <label for="male"><b>Male</b></label> 
                &nbsp;&nbsp;&nbsp;
                <input type="radio" name="gender" id="female"> <label for="female"><b>Female</b></label>
            </td>
        </tr>

      
        <tr>
            <td><b>Department :</b></td>
            <td>
                <input type="checkbox" id="cse"> <label for="cse"><b>CSE</b></label> &nbsp;
                <input type="checkbox" id="it"> <label for="it"><b>IT</b></label> &nbsp;
                <input type="checkbox" id="ece"> <label for="ece"><b>ECE</b></label> &nbsp;
                <input type="checkbox" id="civil"> <label for="civil"><b>Civil</b></label> &nbsp;
                <input type="checkbox" id="mech"> <label for="mech"><b>Mech</b></label>
            </td>
        </tr>

    
        <tr>
            <td><b>Course :</b></td>
            <td>
                <select>
                    <option>----------------------- Select Current Course's -----------------------</option>
                        <option>Python</option>
                        <option>c</option>
                        <option>c++</option>
                        <option>Java</option>
                </select>
            </td>
        </tr>

    
        <tr>
            <td><b>Student photo :</b></td>
            <td><input type="file"></td>
        </tr>

        
        <tr>
            <td><b>City :</b></td>
            <td><input type="text" ></td>
        </tr>

        
        <tr>
           
            <td valign="top"><b>Address :</b></td>
            <td><textarea ></textarea></td>
        </tr>

    </table>
</body>
</html>
